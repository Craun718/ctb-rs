[package]
name = "ctb-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
geotiff-reader = { version = "0.8.0", default-features = false, features = ["local"] }
geotiff-writer = "0.8.0"
ndarray = "0.17.2"
