[package]
name = "ctb-rs"
version = "0.0.1"
edition = "2024"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
geotiff-core = "0.10.0"
geotiff-reader = { version = "0.10.0", default-features = false, features = ["local"] }
geotiff-writer = { version = "0.10.0", default-features = false }
ndarray = "0.17.2"
oxigeo = { version = "0.2.3", default-features = false, features = ["geotiff", "vrt"] }
proj4rs = { version = "0.1.10", default-features = false, features = ["crs-definitions"] }
tiff-core = { version = "0.10.0", default-features = false }
