[package]
name = "ctb-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
geotiff-reader = { version = "0.11.1", default-features = false, features = ["local"] }
geotiff-writer = "0.11.1"
ndarray = "0.17.2"
proj4rs = { version = "0.1.10", default-features = false, features = ["crs-definitions"] }
quick-xml = "0.41.0"
serde_json = "1"
