name: ctb-cpp-benchmark

# Measure how long cesium-terrain-builder's ctb-tile (0.4.1, prebuilt via
# homme/cesium-terrain-builder:0.4.1) takes to produce terrain tiles from the
# demo raster. This job is intentionally unrelated to the Rust implementation
# in this repository; it only benchmarks the external C++ tool.

on:
  push:
  pull_request:

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out ctb-rs with LFS demo data
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Measure ctb-tile tiling time
        run: |
          set -euxo pipefail
          input="$(pwd)/demo/guangxi_8_cities.tif"
          test -f "$input"
          output_dir="$(mktemp -d)"
          trap 'rm -rf "$output_dir"' EXIT

          start="$(date +%s.%N)"
          docker run --rm \
            -v "$(pwd):$(pwd)" -w "$(pwd)" \
            homme/cesium-terrain-builder:0.4.1 \
            ctb-tile -q -o "$output_dir" "$input"
          end="$(date +%s.%N)"

          elapsed_seconds="$(awk -v s="$start" -v e="$end" 'BEGIN { printf "%.3f", e - s }')"
          terrain_tiles="$(find "$output_dir" -name '*.terrain' -type f | wc -l | tr -d ' ')"
          data_size_bytes="$(stat -c %s "$input")"

          tee -a "$GITHUB_STEP_SUMMARY" <<EOF
          | metric | value |
          | --- | --- |
          | image | homme/cesium-terrain-builder:0.4.1 |
          | ctb version | 0.4.1 (prebuilt) |
          | input | $input |
          | data_size_bytes | $data_size_bytes |
          | elapsed_seconds | $elapsed_seconds |
          | terrain_tiles | $terrain_tiles |
          EOF
          echo "ctb_tile_elapsed_seconds=$elapsed_seconds"
          echo "terrain_tiles=$terrain_tiles"
