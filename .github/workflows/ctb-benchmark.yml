name: ctb-benchmark

on:
  push:
  pull_request:

concurrency:
  group: ctb-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out repository with LFS demo data
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ctb-rs-benchmark-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ctb-rs-benchmark-${{ runner.os }}-

      - name: Build release ctb-tile
        run: cargo build --release --locked --bin ctb-tile

      - name: Pull C++ ctb-tile image
        run: docker pull homme/cesium-terrain-builder:0.4.1

      - name: Compare tiling time
        shell: bash
        run: |
          set -euo pipefail
          input="$PWD/demo/guangxi_8_cities.tif"
          test -f "$input"
          workers="$(nproc)"
          data_size_bytes="$(stat -c %s "$input")"
          work_dir="$(mktemp -d "$PWD/.benchmark.XXXXXX")"
          trap 'rm -rf "$work_dir"' EXIT
          mkdir -p "$work_dir/cpp" "$work_dir/rust"

          start="$(date +%s.%N)"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:$PWD" -w "$PWD" \
            homme/cesium-terrain-builder:0.4.1 \
            ctb-tile -q -c "$workers" -s 14 -e 1 -o "$work_dir/cpp" "$input"
          end="$(date +%s.%N)"
          cpp_seconds="$(awk -v s="$start" -v e="$end" 'BEGIN { printf "%.3f", e - s }')"
          cpp_tiles="$(find "$work_dir/cpp" -name '*.terrain' -type f | wc -l | tr -d ' ')"

          start="$(date +%s.%N)"
          "$PWD/target/release/ctb-tile" -q -c "$workers" -s 14 -e 1 -o "$work_dir/rust" "$input"
          end="$(date +%s.%N)"
          rust_seconds="$(awk -v s="$start" -v e="$end" 'BEGIN { printf "%.3f", e - s }')"
          rust_tiles="$(find "$work_dir/rust" -name '*.terrain' -type f | wc -l | tr -d ' ')"

          tee -a "$GITHUB_STEP_SUMMARY" <<MDEOF
          ## C++ and Rust tiling benchmark

          Input: demo/guangxi_8_cities.tif ($data_size_bytes bytes). Both runs use
          \`-q -c $workers -s 14 -e 1\` on the same runner, C++ first.

          | implementation | version | workers | elapsed_seconds | terrain_tiles | timing scope |
          | --- | --- | ---: | ---: | ---: | --- |
          | C++ | 0.4.1 | $workers | $cpp_seconds | $cpp_tiles | docker run including container startup and shutdown |
          | Rust | ${{ github.sha }} | $workers | $rust_seconds | $rust_tiles | process runtime |

          These are single runs; filesystem cache and runner load can affect the comparison.
          MDEOF
