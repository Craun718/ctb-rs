name: ctb-rs-benchmark

# Run ctb-rs's reproducible developer benchmark on a GitHub Actions runner and
# publish the measured wall-clock timings to the step summary. This benchmark
# is separate from the external C++ ctb-tile benchmark and does not affect the
# build/release matrix in ci.yml.

on:
  push:
  pull_request:

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ctb-rs-benchmark-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ctb-rs-benchmark-${{ runner.os }}-

      - name: Install GDAL (gdal_translate for fixture synthesis)
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y gdal-bin

      - name: Build release ctb-tile
        run: |
          set -euxo pipefail
          cargo build --release --locked --bin ctb-tile

      - name: Run ctb-rs benchmark
        run: |
          set -euxo pipefail
          output_file="$(mktemp)"
          trap 'rm -f "$output_file"' EXIT
          CTB_RS_BIN="$PWD/target/release/ctb-tile" \
            zsh scripts/benchmark-ctb-tile.zsh 512 2 | tee "$output_file"

          single_seconds="$(sed -n 's/^single workers=1 seconds=\([0-9][0-9]*\) .*/\1/p' "$output_file" | head -n 1)"
          parallel_seconds="$(sed -n 's/^parallel workers=2 seconds=\([0-9][0-9]*\) .*/\1/p' "$output_file" | head -n 1)"
          single_tiles="$(sed -n 's/^single workers=1 seconds=[0-9][0-9]* tiles=\([0-9][0-9]*\) .*/\1/p' "$output_file" | head -n 1)"
          parallel_tiles="$(sed -n 's/^parallel workers=2 seconds=[0-9][0-9]* tiles=\([0-9][0-9]*\) .*/\1/p' "$output_file" | head -n 1)"
          tee -a "$GITHUB_STEP_SUMMARY" <<MDEOF
          ## ctb-rs benchmark (512x512 synthetic DEM)

          | metric | value |
          | --- | --- |
          | ctb-rs commit | ${{ github.sha }} |
          | binaries | $PWD/target/release/ctb-tile |
          | script | scripts/benchmark-ctb-tile.zsh 512 2 |
          | single workers=1 elapsed_seconds | $single_seconds |
          | parallel workers=2 elapsed_seconds | $parallel_seconds |
          | single terrain_tiles | $single_tiles |
          | parallel terrain_tiles | $parallel_tiles |
          MDEOF
